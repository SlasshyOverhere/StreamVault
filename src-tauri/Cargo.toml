[package]
name = "slasshyvault"
version = "3.0.61"
description = "A Tauri Media Library App"
authors = ["Suman Patgiri"]
license = "MIT"
repository = "https://github.com/SlasshyOverhere/SlasshyVault"
edition = "2021"
default-run = "slasshyvault"
autobins = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [ "protocol-asset", "tray-icon"] }
tauri-plugin-autostart = { version = "2" }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "blocking", "stream", "gzip", "deflate", "multipart"] }
tokio = { version = "1", features = ["full"] }
regex = "1.10"
walkdir = "2.4"
rayon = "1.10"
dashmap = "5.5"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "5.0"
percent-encoding = "2.3"
rand = "0.8.6"
url = "2.5"
futures-util = "0.3"
notify-rust = "4"
oauth2 = "5.0"
base64 = "0.22"
aes-gcm = "0.10"
open = { version = "5", features = ["shellexecute-on-windows"] }
dotenvy = "0.15"
tiny_http = "0.12"
http = "1"
tokio-tungstenite = { version = "0.24", features = ["native-tls", "handshake"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
socket2 = "0.5"
thiserror = "1.0"
flate2 = "1.0"
crc32fast = "1.4"
tar = "0.4"
rar-stream = { path = "vendor/rar-stream", features = ["async"] }
unrar = "0.5"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
flume = "0.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
wan-test = []

[[bin]]
name = "slasshyvault"
path = "src/main.rs"

[[bin]]
name = "wt_tauri_wan_test"
path = "src/bin/wt_tauri_wan_test.rs"
required-features = ["wan-test"]

